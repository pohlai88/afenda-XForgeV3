# The required check for main.
#
# `pnpm verify --ci` differs from the local gate in two ways that matter:
#   - the phase comes from .architecture/state.json, never from the environment,
#     so a job cannot declare an earlier phase and turn mandatory stages into
#     legitimate PENDINGs
#   - a BLOCKED stage is a FAILURE, so "verify was green" can never come to mean
#     "the database tests never ran"
name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # MUST match compose.yaml. This said 16 while every local run was on 17,
        # so the gate would have been qualifying a different database engine
        # than the one the proof was written against -- and RLS semantics are
        # precisely where major versions diverge.
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: xforge
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      # Injected, never committed. The local fixture credential exists only in
      # the approved fixture locations enforced by the no-shared-dev-secret
      # guard, and is not a working secret anywhere else.
      #
      # BOTH connections are required, and the suite declares which in
      # REQUIRED_DATABASE_ENV (tests/fixtures/local-database.ts). The
      # ci-provides-fixture-env guard reads that declaration and fails this
      # workflow if one is missing -- which is how APP_DATABASE_URL came to be
      # absent here while every local run was green.
      #
      # Use URL-SAFE secrets. These are embedded in connection strings, so a
      # password containing @ : / or # silently produces a malformed URL and a
      # connection error that looks like the database is down.
      DATABASE_URL: postgres://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/xforge
      APP_DATABASE_URL: postgres://app_user:${{ secrets.CI_APP_USER_PASSWORD }}@localhost:5432/xforge

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # READ from package.json's engines.node, never restated here. It said
          # 22 while the project declares >=24 -- not a copy that drifted, a copy
          # that contradicted the declaration outright.
          #
          # Eliminating the second home beats guarding the agreement between two.
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Provision the non-owner app_user role. RLS silently skips owners, so the
      # integration stage is only meaningful when it connects as this role.
      # Provisions app_user with the INJECTED password, which APP_DATABASE_URL
      # above then uses. The password used to be hardcoded in bootstrap.sql,
      # which made CI_APP_USER_PASSWORD inert: set, referenced, and consumed by
      # nothing. A secret that configures nothing is worse than no secret.
      - name: Bootstrap database roles
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -v app_user_password="${{ secrets.CI_APP_USER_PASSWORD }}"
          -f packages/db/bootstrap.sql

      - name: pnpm verify --ci
        run: pnpm verify --ci
